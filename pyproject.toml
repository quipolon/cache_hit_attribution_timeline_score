[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quipolon-cache_hit_attribution_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列量化与稀疏化研究员·缓存命中率的归因的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "quipolon" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://quipolon.github.io"
Repository = "https://github.com/quipolon/cache_hit_attribution_timeline_score"
Issues = "https://github.com/quipolon/cache_hit_attribution_timeline_score/issues"

[project.scripts]
cache_hit_attribution_timeline_score = "cache_hit_attribution_timeline_score:main"

[tool.setuptools]
py-modules = ["cache_hit_attribution_timeline_score"]
